<!DOCTYPE html><html><head><meta charset="utf-8"><title>probe</title>
<style>
  /* Test fixture (driven by verify-hub.js); follows the OS light/dark setting so
     it isn't a blinding white page when opened by hand. */
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; background: Canvas; color: CanvasText; }
  p { margin: 0 0 12px; opacity: .7; }
  iframe { border: 1px solid GrayText; border-radius: 6px; background: Canvas; }
</style>
</head><body>
<p>LocalOffice embed harness - a test fixture for the Hub iframe handoff (not a shipped tool).</p>
<iframe id="f" style="width:800px;height:500px"></iframe>
<script>
// Faithful reproduction of the Hub handoff: real iframe + real postMessage.
// location.hash = encodeURIComponent(JSON.stringify({file, env}))
const cfg = JSON.parse(decodeURIComponent(location.hash.slice(1)));
let done = false;
function send() { try { document.getElementById('f').contentWindow.postMessage({ proto: 'localoffice', type: 'open', text: JSON.stringify(cfg.env) }, '*'); } catch (e) { document.title = 'RESULT:SEND_THREW:' + e.message; } }
window.__lastSave = null;   // verify-embed reads this to confirm Save delegates to the Hub
window.addEventListener('message', (e) => {
  const m = e.data; if (!m || m.proto !== 'localoffice') return;
  if (m.type === 'ready') send();
  else if (m.type === 'opened') { done = true; document.title = 'RESULT:' + JSON.stringify({ ok: m.ok, error: m.error || null }); }
  else if (m.type === 'save') {   // act as the Hub's write side: record + ack so the tool's save resolves
    window.__lastSave = { text: m.text, name: m.name, asNew: !!m.asNew };
    try { document.getElementById('f').contentWindow.postMessage({ proto: 'localoffice', type: 'saved', id: m.id, ok: true, name: m.name || 'probe.localoffice.json' }, '*'); } catch (e2) {}
  }
});
const f = document.getElementById('f');
f.src = cfg.file;
f.addEventListener('load', () => setTimeout(() => { if (!done) send(); }, 150));
setTimeout(() => { if (!done) document.title = 'RESULT:TIMEOUT'; }, 2000);
</script>
</body></html>
