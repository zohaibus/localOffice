<!DOCTYPE html>
<!-- ════════════════════════════════════════════════════════════════════
     localCheck - a LocalOffice tool (body type: runbook)
     An interactive SOP / QA runbook. Steps capture a typed value, and the
     shared verification kernel (exact / coverage / tolerance - all
     DETERMINISTIC, never an LLM) gates pass/fail. You cannot sign off the file
     if the math says a value is out of bounds. The verification thesis, as a
     product. Single file · no dependencies · offline · MIT.
     ════════════════════════════════════════════════════════════════════ -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#fafaf7" />
<title>localCheck</title>
<style>
  :root {
    --bg:#fafaf7; --surface:#fff; --surface-2:#f4f3ee; --ink:#1a1a17; --ink-2:#5a5a55;
    --ink-3:#8a8a83; --border:rgba(0,0,0,.08); --border-strong:rgba(0,0,0,.14);
    --accent:#5a4a2f; --accent-soft:#f0e9d8; --ok:#2f7d3a; --ok-soft:#e6f3e8; --bad:#a4332f; --bad-soft:#f7e7e6;
    --radius:10px; --radius-sm:6px; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.05); color-scheme: light;
  }
  body.dark {
    --bg:#1a1a17; --surface:#242420; --surface-2:#2c2c27; --ink:#f0ede6; --ink-2:#b5b1a8; --ink-3:#807c73;
    --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.16); --accent:#c4a265; --accent-soft:#3a3320;
    --ok:#5fbf6e; --ok-soft:#23371f; --bad:#e08a86; --bad-soft:#3a2422; color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg);
         color: var(--ink); display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
  .toolbar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: var(--surface);
             border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .toolbar input.title { font: inherit; font-weight: 600; font-size: 15px; color: var(--ink); background: transparent;
             border: 1px solid transparent; border-radius: var(--radius-sm); padding: 5px 8px; min-width: 150px; flex: 0 1 240px; }
  .toolbar input.title:hover { border-color: var(--border); }
  .toolbar input.title:focus { outline: none; border-color: var(--accent); background: var(--bg); }
  .sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }
  .spacer { flex: 1; }
  button { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--border-strong);
           border-radius: var(--radius-sm); padding: 6px 11px; cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.icon { padding: 6px 9px; }
  select, input[type=text], input[type=number], textarea { font: inherit; font-size: 13px; color: var(--ink);
           background: var(--bg); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 5px 8px; }
  #status { font-size: 12px; color: var(--ink-2); margin-left: 8px; }

  main { flex: 1; overflow: auto; padding: 22px; }
  .wrap { max-width: 820px; margin: 0 auto; }
  .step { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
          padding: 12px 14px; margin-bottom: 10px; display: flex; gap: 12px; align-items: flex-start; }
  .step .n { color: var(--ink-3); font-variant-numeric: tabular-nums; font-size: 13px; padding-top: 6px; min-width: 22px; }
  .step .val, .step .sp-min, .step .sp-max { font-variant-numeric: tabular-nums; }   /* measured readings align */
  .step .body { flex: 1; min-width: 0; }
  .step .text { width: 100%; border: 1px solid transparent; background: transparent; font-size: 15px; padding: 5px 6px; border-radius: var(--radius-sm); }
  .step .text:hover { border-color: var(--border); } .step .text:focus { outline: none; border-color: var(--accent); background: var(--bg); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  .row label { font-size: 12px; color: var(--ink-2); }
  .row input[type=number] { width: 92px; } .row input.val { width: 130px; } .row input.exp { width: 200px; }
  .badge { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 10px; }
  .badge.ok { background: var(--ok-soft); color: var(--ok); } .badge.bad { background: var(--bad-soft); color: var(--bad); }
  .badge.pend { background: var(--surface-2); color: var(--ink-3); }
  .step .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--ink-3); }
  .step .rm { background: none; border: none; color: var(--ink-3); cursor: pointer; font-size: 15px; padding: 4px 6px; }
  .step .rm:hover { color: var(--bad); }
  .chk { width: 18px; height: 18px; margin-top: 6px; cursor: pointer; }
  .step.diag-hidden { opacity: .5; border-style: dashed; }
  .step.diag-trig { border-left: 3px solid var(--accent); background: var(--accent-soft); }
  .diag-tog { font-size: 11px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  .diag-tog input { width: 13px; height: 13px; cursor: pointer; }
  .tag { font-size: 11px; border-radius: 999px; padding: 1px 8px; }
  .tag.hid { background: var(--surface-2); color: var(--ink-3); }
  .tag.trig { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .row select.br-goto { max-width: 260px; }
  .row .usb-read, .row .usb-cfg { padding: 4px 9px; font-size: 12px; }
  .ser-tag { font-size: 11px; color: var(--ink-3); }
  textarea.note { width: 100%; min-height: 48px; resize: vertical; margin-top: 6px; }

  .signbar { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--border);
             padding: 12px 22px; display: flex; align-items: center; gap: 14px; }
  .signbar .summary { font-size: 14px; flex: 1; }
  .signbar .summary b { color: var(--ink); }
  .signbar.ready .summary { color: var(--ok); } .signbar.blocked .summary { color: var(--bad); }
  .signbar.tampered { background: var(--bad-soft); border-top-color: var(--bad); }
  .signed-stamp { font-weight: 700; color: var(--ok); }
  .tamper-stamp { font-weight: 800; color: var(--bad); }
  .empty { text-align: center; color: var(--ink-2); padding: 8vh 0; }
  .empty h1 { color: var(--ink); font-size: 20px; margin-bottom: 8px; }
  @media print { .toolbar, .signbar .actions { display: none !important; } }
</style>
</head>
<body class="light">

<div class="toolbar ui">
  <input id="title" class="title" placeholder="Untitled runbook" aria-label="Title" />
  <div class="sep"></div>
  <button onclick="newCheck()">New</button>
  <button onclick="openCheck()">Open</button>
  <button onclick="saveCheck()" title="Save (Ctrl+S)">Save</button>
  <button onclick="saveCheckAs()">Save As</button>
  <select id="tpl" onchange="loadTemplate(this.value); this.selectedIndex=0;" title="Start from a template">
    <option value="">Templates…</option>
    <option value="equip">Equipment readiness</option>
    <option value="deploy">Deployment checklist</option>
  </select>
  <div class="sep"></div>
  <button onclick="addStep('check')">+ Check</button>
  <button onclick="addStep('measure')">+ Measure</button>
  <button onclick="addStep('note')">+ Note</button>
  <div class="spacer"></div>
  <span id="status"></span>
  <div class="sep"></div>
  <button class="icon" onclick="AI.show()" title="Local AI — optional, needs Ollama. Proposes; the kernel decides sign-off.">✦ AI</button>
  <button class="icon" id="theme-btn" onclick="toggleTheme()" title="Light / dark">☾</button>
</div>

<main><div class="wrap" id="steps"></div></main>

<div class="signbar" id="signbar">
  <span class="summary" id="summary"></span>
  <span class="actions"><button class="primary" id="sign-btn" onclick="signOff()">Sign &amp; seal</button></span>
</div>

<style>
#ai-panel{position:fixed;inset:0;z-index:4100;background:rgba(0,0,0,.42);display:none;align-items:center;justify-content:center;padding:24px}
#ai-panel.on{display:flex}
#ai-panel .ac{background:var(--surface,#fff);color:var(--ink,#1a1a17);border:1px solid var(--border-strong,rgba(0,0,0,.18));border-radius:12px;box-shadow:0 18px 60px rgba(0,0,0,.35);width:620px;max-width:100%;max-height:88vh;display:flex;flex-direction:column}
#ai-panel .ah{display:flex;gap:8px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--border,rgba(0,0,0,.1))}
#ai-panel .ah b{flex:1;font-size:14px}
#ai-panel .ab{padding:12px 14px;overflow:auto}
#ai-panel button{font:inherit;font-size:13px;padding:7px 12px;border-radius:7px;border:1px solid var(--border-strong,rgba(0,0,0,.18));background:var(--surface,#fff);color:var(--ink,#1a1a17);cursor:pointer}
#ai-panel select,#ai-panel textarea{font:inherit;font-size:13px;padding:6px 8px;border-radius:7px;border:1px solid var(--border-strong,rgba(0,0,0,.18));background:var(--bg,#fafaf7);color:var(--ink,#1a1a17)}
#ai-panel textarea{width:100%;box-sizing:border-box;min-height:70px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace}

</style>
<div id="ai-panel">
  <div class="ac">
    <div class="ah"><b>✦ Local AI — optional</b><button onclick="AI.hide()">Close</button></div>
    <div class="ab">
      <p style="margin:0 0 10px;font-size:12px;color:var(--ink-2,#5a5a55)">Talks only to a local Ollama at localhost:11434 — nothing leaves your machine. The AI proposes; the deterministic kernel still decides sign-off.</p>
      <label>Model <select id="ai-model"><option value="">(detecting…)</option></select></label>
      <div id="ai-status" style="margin-top:8px;font-size:12px;color:var(--ink-2,#5a5a55)"></div>
      <div style="margin-top:10px;border-top:1px solid var(--border,#0002);padding-top:10px">
        <h3 style="font-size:13px;margin:0 0 6px">Generate a runbook</h3>
        <textarea id="gen-input" placeholder="Describe the runbook…"></textarea>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button id="gen-btn" onclick="ogRun()">Generate</button><button id="gen-stop" class="hidden" onclick="if(ogAbort)ogAbort.abort()">Stop</button>
        </div>
        <div id="gen-preview" class="hidden" style="margin-top:10px;font-size:12px;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--bg,#fafaf7);border:1px solid var(--border,#0002);border-radius:7px;padding:8px 10px;max-height:34vh;overflow:auto"></div>
        <button id="gen-apply" class="hidden" style="margin-top:8px" onclick="ogApply()">Apply (replace)</button>
      </div>
    </div>
  </div>
</div>

<script>
// ── shared verification kernel (inlined; exact + coverage + tolerance) ─
const LocalVerify = (function () {
  'use strict';
  const COMPARATORS = ['exact', 'coverage', 'tolerance'];
  function normalize(s, p = {}) { let o = String(s == null ? '' : s); if (p.trim !== false) o = o.trim(); if (p.collapseWhitespace !== false) o = o.replace(/\s+/g, ' '); if (!p.caseSensitive) o = o.toLowerCase(); if (p.stripPunctuation) o = o.replace(/[.,;:!?'"()\[\]{}]/g, ''); return o; }
  function exact(actual, p = {}) { const exp = normalize(p.expected, p); if (p.expected == null || exp === '') return { pass: false, score: 0, detail: { expected: p.expected == null ? '' : String(p.expected), got: String(actual == null ? '' : actual), reason: 'no expected value' } }; const pass = normalize(actual, p) === exp; return { pass, score: pass ? 1 : 0, detail: { expected: String(p.expected), got: String(actual == null ? '' : actual) } }; }
  function coverage(actual, p = {}) { const req = Array.isArray(p.required) ? p.required : []; const hay = normalize(actual, p); const hit = [], missed = []; for (const kw of req) { const n = normalize(kw, p); if (n && hay.indexOf(n) !== -1) hit.push(kw); else missed.push(kw); } const total = req.length, score = total ? hit.length / total : 0, th = (typeof p.threshold === 'number' && p.threshold > 0) ? Math.min(p.threshold, 1) : 1; return { pass: total > 0 && score >= th, score, detail: { hit, missed, threshold: th } }; }
  function toNum(v) { if (typeof v === 'number') return v; const m = String(v == null ? '' : v).match(/-?\d+(?:\.\d+)?(?:[eE][-+]?\d+)?/); return m ? parseFloat(m[0]) : NaN; }
  function tolerance(actual, p = {}) {
    const a = toNum(actual);
    if (Number.isNaN(a)) return { pass: false, score: 0, detail: { reason: 'no numeric value', got: String(actual == null ? '' : actual) } };
    let lo, hi, basis;
    if (p.min != null || p.max != null) { lo = p.min != null ? p.min : -Infinity; hi = p.max != null ? p.max : Infinity; basis = 'range'; }
    else if (p.expected != null) { const abs = p.abs != null ? p.abs : 0, rel = p.rel != null ? Math.abs(p.expected) * p.rel : 0, t = Math.max(abs, rel); lo = p.expected - t; hi = p.expected + t; basis = 'expected'; }
    else return { pass: false, score: 0, detail: { reason: 'needs min/max or expected' } };
    const pass = a >= lo && a <= hi;
    return { pass, score: pass ? 1 : 0, detail: { actual: a, lo, hi, basis } };
  }
  const FNS = { exact, coverage, tolerance };
  function isSupported(c) { return COMPARATORS.indexOf(c) !== -1; }
  function run(block, actual, opts = {}) { if (!block || !isSupported(block.comparator)) throw new Error('verify: unsupported comparator'); const r = FNS[block.comparator](actual, block.params || {}); if (opts.mutate !== false) block.result = r; return r; }
  return { COMPARATORS, normalize, exact, coverage, tolerance, toNum, run, isSupported };
})();

// ── shared LocalOffice core (inlined; embed-aware IO) ─────────────────
const LocalOffice = (function () {
  'use strict';
  const FORMAT = 'localoffice/v1', FORMAT_PREFIX = 'localoffice/', FILE_EXT = '.localoffice.json';
  const TYPES = ['sheet', 'plan', 'flashcards', 'mindmap', 'slides', 'image', 'runbook', 'doc'];
  function nowISO() { return new Date().toISOString(); }
  function uuid() {
    const c = (typeof crypto !== 'undefined') ? crypto : null;
    if (c && typeof c.randomUUID === 'function') { try { return c.randomUUID(); } catch (_) {} }
    let rnd; if (c && typeof c.getRandomValues === 'function') { const b = new Uint8Array(16); c.getRandomValues(b); b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80; rnd = (i) => b[i]; } else { const a = Array.from({ length: 16 }, () => Math.floor(Math.random() * 256)); a[6] = (a[6] & 0x0f) | 0x40; a[8] = (a[8] & 0x3f) | 0x80; rnd = (i) => a[i]; }
    const h = []; for (let i = 0; i < 16; i++) h.push((rnd(i) + 0x100).toString(16).slice(1));
    return `${h[0]}${h[1]}${h[2]}${h[3]}-${h[4]}${h[5]}-${h[6]}${h[7]}-${h[8]}${h[9]}-${h[10]}${h[11]}${h[12]}${h[13]}${h[14]}${h[15]}`;
  }
  function isPlainObject(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }
  function freshBody(type) { return type === 'runbook' ? { steps: [] } : {}; }
  function createEnvelope(type, opts = {}) { if (!TYPES.includes(type)) throw new Error('createEnvelope: unknown type "' + type + '"'); const ts = nowISO(); return { format: FORMAT, type, meta: { id: opts.id || uuid(), title: opts.title || '', created: ts, modified: ts, app: opts.app || '', tags: Array.isArray(opts.tags) ? opts.tags.slice() : [] }, body: isPlainObject(opts.body) ? opts.body : freshBody(type) }; }
  function validate(obj) { const e = [], w = []; if (!isPlainObject(obj)) return { ok: false, errors: ['Not a JSON object.'], warnings: w, type: null }; if (typeof obj.format !== 'string') e.push('Missing "format".'); else if (!obj.format.startsWith(FORMAT_PREFIX)) e.push('Unrecognized format.'); if (typeof obj.type !== 'string' || !obj.type) e.push('Missing "type".'); else if (!TYPES.includes(obj.type)) w.push('Unknown type.'); if (!isPlainObject(obj.meta)) e.push('Missing "meta".'); if (!isPlainObject(obj.body)) w.push('Missing "body".'); return { ok: e.length === 0, errors: e, warnings: w, type: typeof obj.type === 'string' ? obj.type : null }; }
  function normalize(obj) { if (!isPlainObject(obj.meta)) obj.meta = {}; const m = obj.meta; if (typeof m.id !== 'string' || !m.id) m.id = uuid(); if (typeof m.title !== 'string') m.title = ''; if (typeof m.created !== 'string') m.created = nowISO(); if (typeof m.modified !== 'string') m.modified = m.created; if (typeof m.app !== 'string') m.app = ''; if (!Array.isArray(m.tags)) m.tags = []; if (!isPlainObject(obj.body)) obj.body = freshBody(obj.type); return obj; }
  class LoadError extends Error { constructor(m, d) { super(m); this.name = 'LoadError'; this.detail = d; } }
  function parse(text, opts = {}) { let raw; try { raw = JSON.parse(text); } catch (e) { throw new LoadError('File is not valid JSON.', e.message); } let r = validate(raw), obj = raw; if (!r.ok && typeof opts.coerce === 'function') { const c = opts.coerce(raw); if (isPlainObject(c)) { obj = c; r = validate(obj); } } if (!r.ok) throw new LoadError('Not a LocalOffice file: ' + r.errors.join(' '), r.errors); normalize(obj); return { envelope: obj, warnings: r.warnings }; }
  function stringify(env, pretty = true) { return JSON.stringify(env, null, pretty ? 2 : 0); }
  function serialize(env, opts = {}) { if (!isPlainObject(env)) throw new Error('serialize: not an object'); const r = validate(env); if (!r.ok) throw new Error('serialize: invalid - ' + r.errors.join(' ')); if (opts.touch !== false) { if (!isPlainObject(env.meta)) env.meta = {}; env.meta.modified = nowISO(); } return stringify(env, opts.pretty !== false); }
  function slugify(s) { return String(s || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60); }
  function suggestedName(env) { return (slugify(env && env.meta && env.meta.title) || (env && env.type) || 'untitled') + FILE_EXT; }
  function supportsFS() { return typeof window !== 'undefined' && 'showSaveFilePicker' in window; }
  const PICKER_TYPES = [{ description: 'LocalOffice file', accept: { 'application/json': ['.json'] } }];
  function pickFileFallback() { return new Promise((res, rej) => { const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json'; i.style.display = 'none'; i.addEventListener('change', () => { const f = i.files && i.files[0]; i.remove(); f ? res(f) : rej(new Error('No file selected.')); }); document.body.appendChild(i); i.click(); }); }
  function isEmbedded() { return typeof window !== 'undefined' && window.parent && window.parent !== window; }
  function hubSave(text, name, asNew) { return new Promise((resolve, reject) => { const id = 'lo' + Math.random().toString(36).slice(2); function on(e) { const m = e.data; if (!m || m.proto !== 'localoffice' || m.type !== 'saved' || m.id !== id) return; window.removeEventListener('message', on); if (m.ok) resolve({ handle: null, name: m.name || name }); else if (m.error === 'cancelled') { const a = new Error('cancelled'); a.name = 'AbortError'; reject(a); } else reject(new Error(m.error || 'Save failed')); } window.addEventListener('message', on); window.parent.postMessage({ proto: 'localoffice', type: 'save', id, text, name, asNew: !!asNew }, '*'); }); }
  async function openFile(opts = {}) { if (supportsFS()) { try { const [h] = await window.showOpenFilePicker({ types: PICKER_TYPES, multiple: false }); const f = await h.getFile(); const { envelope, warnings } = parse(await f.text(), opts); return { envelope, handle: h, name: f.name, warnings }; } catch (e) { if (e && e.name === 'AbortError') throw e; } } const f = await pickFileFallback(); const { envelope, warnings } = parse(await f.text(), opts); return { envelope, handle: null, name: f.name, warnings }; }
  async function saveFile(env, handle, opts = {}) { const text = serialize(env, opts); if (isEmbedded()) return hubSave(text, suggestedName(env), false); if (handle && typeof handle.createWritable === 'function') { const w = await handle.createWritable(); await w.write(text); await w.close(); return { handle, name: handle.name }; } return saveFileAs(env, suggestedName(env), { ...opts, _text: text }); }
  async function saveFileAs(env, suggested, opts = {}) { const text = opts._text != null ? opts._text : serialize(env, opts); const name = suggested || suggestedName(env); if (isEmbedded()) return hubSave(text, name, true); if (supportsFS()) { const h = await window.showSaveFilePicker({ suggestedName: name, types: PICKER_TYPES }); const w = await h.createWritable(); await w.write(text); await w.close(); return { handle: h, name: h.name }; } download(text, name); return { handle: null, name }; }
  function download(text, filename) { const b = new Blob([text], { type: 'application/json' }), u = URL.createObjectURL(b); const a = document.createElement('a'); a.href = u; a.download = filename || ('untitled' + FILE_EXT); document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 0); }
  return { FORMAT, FILE_EXT, TYPES, uuid, createEnvelope, validate, normalize, parse, stringify, serialize, slugify, suggestedName, LoadError, supportsFS, openFile, saveFile, saveFileAs, download };
})();

// ════════════════════════════════════════════════════════════════════
// localCheck - state + logic
// ════════════════════════════════════════════════════════════════════
const APP = 'localcheck@1.0';
const THEME_KEY = 'localcheck_theme';
let data = { steps: [] };     // body: { steps:[ {id, kind, text, ...} ] }
let title = 'Untitled runbook';
let fileHandle = null;
let signed = false;
let sealState = null;   // null | 'intact' | 'tampered' | 'unknown' (sealed-but-unverifiable)

const $ = id => document.getElementById(id);
function uid() { return 's_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function setStatus(m) { $('status').textContent = m || ''; }
function markDirty() { signed = false; if (data && data.seal) { data.seal = null; sealState = null; } }   // any edit voids the seal

// ── evaluation (pure; the deterministic gate) ─────────────────────────
function evalMeasure(step) {
  if (step.value == null || step.value === '') return null;        // pending
  try { return LocalVerify.run({ comparator: step.comparator, params: step.params || {} }, step.value, { mutate: false }); }
  catch (e) { return { pass: false, score: 0, detail: { reason: e.message } }; }
}
function stepPasses(step) {
  if (step.kind === 'check') return !!step.done;
  if (step.kind === 'measure') { const r = evalMeasure(step); return !!(r && r.pass); }
  return true; // notes never block
}
// ── conditional branching (state-machine runbook) ────────────────────
// A step flagged `diagnostic:true` is HIDDEN until something branches to it.

    s.textContent = '#eh{position:fixed;inset:0;z-index:4200;background:rgba(0,0,0,.42);display:none;align-items:center;justify-content:center;padding:24px}#eh.on{display:flex}#eh .m{background:var(--surface,#fff);color:var(--ink,#1a1a17);border:1px solid var(--border-strong,rgba(0,0,0,.18));border-radius:12px;box-shadow:0 18px 60px rgba(0,0,0,.35);width:900px;max-width:100%;max-height:90vh;display:flex;flex-direction:column}#eh .h{display:flex;gap:8px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--border,rgba(0,0,0,.1))}#eh .h b{flex:1;font-size:14px}#eh .bd{padding:12px 14px;overflow:auto}#eh button,#eh select{font:inherit;font-size:13px;padding:7px 11px;border-radius:7px;border:1px solid var(--border-strong,rgba(0,0,0,.18));background:var(--surface,#fff);color:var(--ink,#1a1a17);cursor:pointer}#eh .eh-card{border:1px solid var(--border-strong,rgba(0,0,0,.18));border-radius:10px;margin-bottom:12px;overflow:hidden;background:var(--bg,#fafaf7)}#eh .eh-hd{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border,rgba(0,0,0,.1))}#eh .eh-tag{font-size:12px;font-weight:600;color:var(--ink-2,#5a5a55);border:1px solid var(--border,rgba(0,0,0,.12));border-radius:999px;padding:2px 9px;white-space:nowrap}#eh .eh-t{flex:1;font-size:13px}#eh .eh-edit,#eh .eh-rm{padding:3px 9px}#eh .eh-prev{font-size:26px;color:var(--ink,#1a1a17);padding:12px 14px;display:flex;align-items:center;justify-content:center;min-height:80px;max-height:46vh;overflow:auto;cursor:pointer}#eh .eh-prev .lo-r-svg{width:100%;height:260px}#eh .eh-empty{font-size:13px;color:var(--ink-2,#5a5a55);padding:8px 2px}#eh-editor{position:fixed;inset:0;z-index:4300;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:22px}#eh-editor.on{display:flex}#eh-editor .ee-m{background:var(--surface,#fff);color:var(--ink,#1a1a17);border:1px solid var(--border-strong,rgba(0,0,0,.18));border-radius:12px;width:1040px;max-width:100%;height:88vh;display:flex;flex-direction:column;box-shadow:0 18px 60px rgba(0,0,0,.45)}#eh-editor .ee-h{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border,rgba(0,0,0,.1))}#eh-editor .ee-h b{font-size:14px}#eh-editor .ee-note{flex:1;font-size:12px;color:var(--ink-2,#5a5a55)}#eh-editor .ee-body{flex:1;overflow:hidden}#eh-editor .ee-frame{width:100%;height:100%;border:0;display:block;background:#fff}';
    document.head.appendChild(s);
    host = document.createElement('div'); host.id = 'eh';
    host.innerHTML = '<div class="m"><div class="h"><b>\u25F2 Embedded objects</b>' +
      '<select data-a="add"><option value="">+ Add \u25BE</option><option value="mindmap">Mind map</option><option value="sheet">Sheet</option><option value="runbook">Runbook</option><option value="flashcards">Flashcards</option><option value="plan">Plan</option><option value="slides">Slides</option><option value="doc">Document</option></select>' +
      '<button data-a="x">Close</button></div><div class="bd" data-list></div></div>';
    document.body.appendChild(host);
    listEl = host.querySelector('[data-list]');
    host.querySelector('[data-a="x"]').addEventListener('click', hide);
    host.querySelector('[data-a="add"]').addEventListener('change', e => { const v = e.target.value; e.target.value = ''; if (v) add(v); });
    host.addEventListener('mousedown', e => { if (e.target === host) hide(); });
    document.addEventListener('keydown', e => { if (host && host.classList.contains('on') && !curEdit && e.key === 'Escape') hide(); });
  }
  function add(type) { const list = read().slice(); list.push({ id: uid(), envelope: blankEnvelope(type) }); write(list); render(); }
  function removeEmbed(id) { if (curEdit && curEdit.id === id) closeEditor(); write(read().filter(e => e.id !== id)); render(); }
  function render() {
    const list = read(); listEl.innerHTML = '';
    if (!list.length) { listEl.innerHTML = '<p class="eh-empty">No embedded objects yet. Use <b>+ Add</b> to attach a live object from another tool \u2014 it is drawn here and saved inside this file.</p>'; return; }
    list.forEach(item => {
      const env = item.envelope || {}; const type = env.type; const tool = TOOLS[type];
      const title = (env.meta && env.meta.title) || (tool ? tool.label : type) || 'object';
      const cardEl = document.createElement('div'); cardEl.className = 'eh-card';
      cardEl.innerHTML = '<div class="eh-hd"><span class="eh-tag">\u25F2 ' + esc(tool ? tool.label : (type || 'object')) + '</span><b class="eh-t">' + esc(title) + '</b>' + (tool ? '<button class="eh-edit">Edit \u25F2</button>' : '') + '<button class="eh-rm" title="Remove">\u2715</button></div><div class="eh-prev"' + (tool ? ' title="Double-click to edit"' : '') + '>' + preview(env) + '</div>';
      cardEl.querySelector('.eh-rm').addEventListener('click', () => removeEmbed(item.id));
      const ed = cardEl.querySelector('.eh-edit'); if (ed) ed.addEventListener('click', () => openEditor(item.id));
      const pv = cardEl.querySelector('.eh-prev'); if (tool && pv) pv.addEventListener('dblclick', () => openEditor(item.id));
      listEl.appendChild(cardEl);
    });
  }
  function openEditor(id) {
    const item = read().find(e => e.id === id); if (!item || !TOOLS[item.envelope.type]) return;
    let m = document.getElementById('eh-editor');
    if (!m) {
      m = document.createElement('div'); m.id = 'eh-editor';
      m.innerHTML = '<div class="ee-m"><div class="ee-h"><b></b><span class="ee-note">Edits stream back in. Nothing leaves your machine.</span><button data-a="done">Done</button></div><div class="ee-body"><iframe class="ee-frame" title="Embedded editor"></iframe></div></div>';
      document.body.appendChild(m);
      m.querySelector('[data-a="done"]').addEventListener('click', closeEditor);
      m.addEventListener('mousedown', e => { if (e.target === m) closeEditor(); });
    }
    m.querySelector('.ee-h b').textContent = '\u25F2 ' + (TOOLS[item.envelope.type].label || item.envelope.type);
    const fr = m.querySelector('.ee-frame'); fr.src = TOOLS[item.envelope.type].src;
    curEdit = { id: id, frame: fr }; m.classList.add('on');
  }
  function closeEditor() { const m = document.getElementById('eh-editor'); if (m) { m.classList.remove('on'); const fr = m.querySelector('.ee-frame'); if (fr) fr.src = 'about:blank'; } curEdit = null; render(); }
  window.addEventListener('message', e => {
    const m = e.data; if (!m || m.proto !== 'localoffice') return;
    if (!curEdit || e.source !== curEdit.frame.contentWindow) return;
    const list = read(); const item = list.find(x => x.id === curEdit.id); if (!item) return;
    if (m.type === 'ready') { try { e.source.postMessage({ proto: 'localoffice', type: 'open', embedded: true, text: JSON.stringify(item.envelope) }, '*'); } catch (_) {} }
    else if (m.type === 'embedState') { try { const env = JSON.parse(m.text); if (env && env.type) { item.envelope = env; write(list); render(); } } catch (_) {} }
  });
  function open() { if (!host) build(); render(); host.classList.add('on'); }
  function hide() { if (host) host.classList.remove('on'); }
  function init(h) {
    hooks = h; if (!host) build();
    const btn = document.createElement('button'); btn.textContent = '\u25F2 Embeds'; btn.title = "Embed another tool's object as content saved inside this file";
    const anchor = document.querySelector('#theme-btn, #btn-theme, #btn-mode');
    if (anchor && anchor.parentNode) { btn.className = anchor.className; anchor.parentNode.insertBefore(btn, anchor); }
    else (document.querySelector('header, .toolbar, .topbar') || document.body).appendChild(btn);
    btn.addEventListener('click', open);
  }
  return { init, open, hide, list: read };
})();
EmbedHost.init({ read: () => (data.embeds || []), write: (a) => { data.embeds = a; } });

// ── embed-as-live-object: when a host tool embeds this file, feed edits back (state carryover) ──
(function () {
  if (window.parent === window) return;
  var embedded = false, tmr = null;
  function serialize() { return LocalOffice.stringify(exportData()); }
  function push(target) { try { (target || window.parent).postMessage({ proto: 'localoffice', type: 'embedState', text: serialize() }, '*'); } catch (_) {} }
  function schedule() { if (!embedded) return; clearTimeout(tmr); tmr = setTimeout(function () { push(); }, 400); }
  window.addEventListener('message', function (e) {
    var m = e.data; if (!m || m.proto !== 'localoffice') return;
    if (m.type === 'open' && m.embedded) { embedded = true; document.body.classList.add('lo-embedded'); }
    else if (m.type === 'embedFlush') { push(e.source || window.parent); }
  });
  ['input', 'change', 'keyup', 'pointerup'].forEach(function (ev) { document.addEventListener(ev, schedule, true); });
  var st = document.createElement('style'); st.textContent = '.lo-embedded{padding:0!important}'; document.head.appendChild(st);
})();
const LOCALCHECK_PROMPT = `You output ONE localoffice/v1 "runbook" file as JSON. Reply with ONLY the JSON (no prose, no code fences).

Shape:
{
  "format": "localoffice/v1",
  "type": "runbook",
  "meta": { "title": "<runbook title>" },
  "body": {
    "steps": [
      { "id": "<unique-id>", "kind": "check", "text": "<what to confirm>" },
      { "id": "<unique-id>", "kind": "measure", "text": "<what to measure>",
        "comparator": "tolerance", "params": { "min": 3.2, "max": 3.4 } },
      { "id": "<unique-id>", "kind": "note", "text": "<free note>" }
    ]
  }
}

Rules:
- Three step kinds: "check" (tick to confirm), "measure" (a value graded by the kernel), "note" (never gates).
- A "measure" step MUST have "comparator" + "params":
  - "tolerance": numeric, params { "min": <n>, "max": <n> }  OR  { "expected": <n>, "abs": <n> }
  - "exact": params { "expected": "<string>" }
  - "coverage": params { "required": ["<keyword>"] }
- Sign-off is blocked until every check is done and every measure passes - the math decides, not the AI.
- Each step needs a unique "id". Produce a realistic ordered runbook.

Now produce a runbook for:
<describe the runbook you want>`;
JsonPanel.setPrompt(LOCALCHECK_PROMPT);

// ── optional local-AI panel: talks ONLY to a local Ollama (localhost) — no cloud, no telemetry ──
const AI = {
  host: 'http://localhost:11434', model: '', models: [],
  async detect() {
    const sel = document.getElementById('ai-model'), st = document.getElementById('ai-status');
    try {
      const r = await fetch(this.host + '/api/tags'); if (!r.ok) throw 0;
      const j = await r.json(); this.models = (j.models || []).map(m => m.name);
      if (!this.models.length) { sel.innerHTML = '<option value="">(no models)</option>'; st.textContent = 'Ollama is running but has no models. Try: ollama pull llama3.2'; return; }
      sel.innerHTML = this.models.map(m => '<option>' + m + '</option>').join(''); sel.value = this.models[0]; this.model = this.models[0];
      st.classList.remove('err'); st.textContent = 'Ready — ' + this.models.length + ' model' + (this.models.length > 1 ? 's' : '') + ' found.';
    } catch (e) { sel.innerHTML = '<option value="">(offline)</option>'; st.classList.remove('err'); st.textContent = 'No local Ollama at ' + this.host + '. Start it (ollama serve), or use ✦ Prompt in the JSON panel to draft in any LLM.'; }
  },
  show() { document.getElementById('ai-panel').classList.add('on'); this.detect(); },
  hide() { document.getElementById('ai-panel').classList.remove('on'); },
};
window.AI = AI; // handle for tests/console; doesn't change the UX

// ── in-app "Generate a runbook" from a description via local Ollama (uses the ✦ Prompt) ──
let ogPending = null, ogAbort = null;
async function ogRun() {
  const st = document.getElementById('ai-status'), inp = document.getElementById('gen-input');
  const desc = (inp.value || '').trim(); if (!desc) { st.classList.add('err'); st.textContent = 'Describe the runbook first.'; return; }
  const model = document.getElementById('ai-model').value; if (!model) { st.classList.add('err'); st.textContent = 'Pick a model first (start Ollama, then reopen).'; return; }
  const gb = document.getElementById('gen-btn'), sb = document.getElementById('gen-stop'), pv = document.getElementById('gen-preview'), ap = document.getElementById('gen-apply');
  gb.classList.add('hidden'); sb.classList.remove('hidden'); pv.classList.add('hidden'); ap.classList.add('hidden'); st.classList.remove('err');
  ogAbort = new AbortController(); const t0 = Date.now(); const tk = setInterval(function () { st.textContent = 'Drafting… ' + ((Date.now() - t0) / 1000).toFixed(1) + 's'; }, 150);
  try {
    const full = LOCALCHECK_PROMPT.replace('<describe the runbook you want>', function () { return desc; });
    const res = await fetch(AI.host + '/api/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: model, prompt: full, stream: false, format: 'json', options: { temperature: 0 } }), signal: ogAbort.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const raw = JSON.parse((await res.json()).response);
    let env = (raw && raw.type === 'runbook' && raw.body) ? raw : (raw && raw.body && Array.isArray(raw.body.steps)) ? raw : (raw && Array.isArray(raw.steps)) ? { meta: { title: raw.title || 'Untitled' }, body: raw } : null;
    if (!env || !env.body || !Array.isArray(env.body.steps) || !env.body.steps.length) throw new Error('The model did not return a runbook I can read.');
    env.format = 'localoffice/v1'; env.type = 'runbook'; if (!env.meta) env.meta = { title: 'Untitled' };
    ogPending = env;
    pv.textContent = 'Title: ' + (env.meta.title || '(untitled)') + '\n' + env.body.steps.length + ' step(s).';
    pv.classList.remove('hidden'); ap.classList.remove('hidden');
    st.textContent = 'Drafted in ' + ((Date.now() - t0) / 1000).toFixed(1) + 's. Review, then Apply.';
  } catch (e) { st.classList.add('err'); st.textContent = (e.name === 'AbortError') ? 'Stopped.' : ('Error: ' + e.message); }
  finally { clearInterval(tk); gb.classList.remove('hidden'); sb.classList.add('hidden'); ogAbort = null; }
}
function ogApply() {
  if (!ogPending) return; const st = document.getElementById('ai-status'); const env = ogPending;
  try { applyOpened(env); ogPending = null; document.getElementById('gen-preview').classList.add('hidden'); document.getElementById('gen-apply').classList.add('hidden'); st.classList.remove('err'); st.textContent = 'Applied — nothing left your machine. Sign-off still gated by the kernel.'; }
  catch (e) { st.classList.add('err'); st.textContent = 'Could not apply: ' + (e && e.message || e); }
}

if (window.parent && window.parent !== window) window.parent.postMessage({ proto: 'localoffice', type: 'ready', tool: 'localCheck' }, '*');
